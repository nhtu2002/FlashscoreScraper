<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashscore Live Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-5">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-emerald-400 flex items-center gap-2">
          <span>⚽ Flashscore Live Board</span>
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">Tự động đồng bộ bảng tỷ số trực tiếp từ trang chủ Flashscore.com</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <input id="targetUrl" type="text" value="https://www.flashscore.com/"
          class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs md:text-sm w-64 focus:outline-none focus:border-emerald-500" />
        <button id="scrapeBtn" onclick="fetchMatches()"
          class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg text-xs md:text-sm transition flex items-center gap-2 shadow-lg shadow-emerald-900/30">
          <span>🔄 Cập nhật bảng đấu</span>
        </button>
      </div>
    </div>

    <!-- Thanh lọc nhanh & Tìm kiếm -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex flex-wrap gap-2" id="filterTabs">
        <button onclick="setFilter('all')" data-filter="all" class="filter-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white">Tất cả (<span id="count-all">0</span>)</button>
        <button onclick="setFilter('live')" data-filter="live" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-rose-400 border border-slate-800 hover:border-rose-500/50">🔴 Đang đá (<span id="count-live">0</span>)</button>
        <button onclick="setFilter('scheduled')" data-filter="scheduled" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-amber-400 border border-slate-800 hover:border-amber-500/50">🕒 Sắp đá (<span id="count-scheduled">0</span>)</button>
        <button onclick="setFilter('finished')" data-filter="finished" class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-600">✅ Kết thúc (<span id="count-finished">0</span>)</button>
      </div>

      <div class="flex items-center gap-2">
        <input id="searchInput" oninput="renderTable()" type="text" placeholder="🔍 Tìm đội bóng hoặc giải đấu..."
          class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs w-full sm:w-64 focus:outline-none focus:border-emerald-500" />
        <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">
          📥 Xuất Excel (CSV)
        </button>
      </div>
    </div>

    <!-- Thông báo trạng thái -->
    <div id="statusBox" class="hidden rounded-xl p-3 text-xs md:text-sm"></div>

    <!-- Bảng dữ liệu chính -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800/70 text-slate-400 text-[11px] uppercase tracking-wider border-b border-slate-800">
              <th class="py-3 px-4 w-28">Giờ / Trạng thái</th>
              <th class="py-3 px-4">Giải đấu</th>
              <th class="py-3 px-4 text-right">Đội nhà</th>
              <th class="py-3 px-4 text-center w-28">Tỷ số</th>
              <th class="py-3 px-4">Đội khách</th>
              <th class="py-3 px-4 text-center w-24">Chi tiết</th>
            </tr>
          </thead>
          <tbody id="matchTableBody" class="divide-y divide-slate-800/60 text-xs md:text-sm">
            <tr>
              <td colspan="6" class="py-12 text-center text-slate-500">
                Đang sẵn sàng. Nhấn <b>"Cập nhật bảng đấu"</b> để tải dữ liệu từ Flashscore...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = window.location.origin;
    let allMatches = [];
    let currentFilter = 'all';

    function showStatus(msg, type = 'info') {
      const box = document.getElementById('statusBox');
      const styles = {
        info: 'bg-blue-950/70 border border-blue-800 text-blue-300',
        success: 'bg-emerald-950/70 border border-emerald-800 text-emerald-300',
        error: 'bg-rose-950/70 border border-rose-800 text-rose-300'
      };
      box.textContent = msg;
      box.className = `rounded-xl p-3 text-xs md:text-sm ${styles[type]}`;
      box.classList.remove('hidden');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.classList.add('bg-emerald-600', 'text-white');
          btn.classList.remove('bg-slate-900');
        } else {
          btn.classList.remove('bg-emerald-600', 'text-white');
          btn.classList.add('bg-slate-900');
        }
      });
      renderTable();
    }

    async function fetchMatches() {
      const url = document.getElementById('targetUrl').value.trim() || 'https://www.flashscore.com/';
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Đang tải từ Flashscore...</span>';
      showStatus('Đang mở trình duyệt ảo lấy dữ liệu trang chủ Flashscore (mất khoảng 5 - 10 giây)...', 'info');

      try {
        const res = await fetch(`${API_BASE}/api/scrape?action=home&url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || 'Lỗi server');

        allMatches = data.matches || [];
        updateCounts();
        renderTable();
        showStatus(`✅ Đã tải thành công ${allMatches.length} trận đấu từ trang chủ!`, 'success');
      } catch (err) {
        showStatus(`❌ Lỗi: ${err.message}`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔄 Cập nhật bảng đấu</span>';
      }
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allMatches.length;
      document.getElementById('count-live').textContent = allMatches.filter(m => m.state === 'live').length;
      document.getElementById('count-scheduled').textContent = allMatches.filter(m => m.state === 'scheduled').length;
      document.getElementById('count-finished').textContent = allMatches.filter(m => m.state === 'finished').length;
    }

    function renderTable() {
      const tbody = document.getElementById('matchTableBody');
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allMatches.filter(m => {
        const matchTab = currentFilter === 'all' || m.state === currentFilter;
        const matchSearch = !keyword || 
          m.home.toLowerCase().includes(keyword) || 
          m.away.toLowerCase().includes(keyword) || 
          m.league.toLowerCase().includes(keyword);
        return matchTab && matchSearch;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-500">Không có trận đấu nào phù hợp bộ lọc.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(m => {
        let badgeClass = 'bg-slate-800 text-slate-300';
        let scoreClass = 'bg-slate-800/80 text-slate-200';
        
        if (m.state === 'live') {
          badgeClass = 'bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse';
          scoreClass = 'bg-rose-600 text-white font-bold';
        } else if (m.state === 'scheduled') {
          badgeClass = 'bg-amber-500/15 text-amber-300 border border-amber-500/30';
          scoreClass = 'bg-slate-800/40 text-slate-500';
        }

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-3 px-4 whitespace-nowrap">
              <span class="inline-block px-2 py-0.5 rounded text-xs font-medium ${badgeClass}">${m.status || '-'}</span>
            </td>
            <td class="py-3 px-4 text-xs text-slate-400 max-w-[220px] truncate" title="${m.league}">
              ${m.league}
            </td>
            <td class="py-3 px-4 text-right font-medium text-slate-100">${m.home}</td>
            <td class="py-3 px-4 text-center">
              <span class="inline-block px-2.5 py-1 rounded-md text-xs font-mono ${scoreClass}">${m.score}</span>
            </td>
            <td class="py-3 px-4 font-medium text-slate-100">${m.away}</td>
            <td class="py-3 px-4 text-center">
              ${m.url ? `<a href="${m.url}" target="_blank" class="text-xs text-emerald-400 hover:underline">Xem ↗</a>` : '-'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      if (!allMatches.length) return;
      const rows = [["Trang thai", "Giai dau", "Doi nha", "Ty so", "Doi khach", "Link"]];
      allMatches.forEach(m => rows.push([m.status, m.league, m.home, m.score, m.away, m.url]));
      const csvContent = "\uFEFF" + rows.map(e => e.map(v => `"${(v || '').replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `flashscore_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    // Tự động tải dữ liệu ngay khi vừa mở trang
    window.addEventListener('DOMContentLoaded', fetchMatches);
  </script>
</body>
</html>
